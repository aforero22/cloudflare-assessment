# nginx site for the cf-assessment origin (/etc/nginx/sites-available/cf-assessment).
#
# Written for nginx 1.24 (Ubuntu 24.04): uses "listen ... ssl http2" syntax.
# Three TLS server blocks, all using the Let's Encrypt certificate
# (SAN: origin.iforecast.es, tunnel.iforecast.es) - i.e. a NON-Cloudflare cert,
# which is what Cloudflare "Full (strict)" and cloudflared validate.
#
#  1. 0.0.0.0:443 default_server -> rejects the TLS handshake for unknown SNI
#     (e.g. https://<raw IP>), so the box never answers for anything it does not own.
#  2. 0.0.0.0:443 origin.iforecast.es -> requires a client certificate signed by
#     our private CA (per-hostname Authenticated Origin Pulls). Only Cloudflare,
#     on behalf of THIS zone, holds that client cert.
#  3. 127.0.0.1:8443 tunnel.iforecast.es -> loopback-only listener for cloudflared
#     (no mTLS: AOP does not apply to Tunnel traffic; cloudflared verifies our cert
#     via originServerName instead).
# Port 443 is additionally restricted to Cloudflare IP ranges (Azure NSG + ufw).

# Real visitor IP for logs: trust CF-Connecting-IP only from Cloudflare ranges is
# not needed here because the firewall only admits Cloudflare; we log it explicitly.
log_format cfa '$remote_addr cf_ip=$http_cf_connecting_ip ray=$http_cf_ray host=$host '
               '"$request" $status $body_bytes_sent ssl_client_verify=$ssl_client_verify';

# ssl_prefer_server_ciphers is already set globally in Ubuntu's nginx.conf;
# protocols are pinned per server block below (Ubuntu's global default still allows TLS 1.0/1.1).

# 1) Catch-all: refuse TLS for any SNI that is not explicitly configured.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    access_log /var/log/nginx/cfa-default.log cfa;
    return 444;
}

# 2) Public origin, reachable only via Cloudflare proxy + AOP client cert.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name origin.iforecast.es;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/ssl/cf-assessment/fullchain.pem;
    ssl_certificate_key /etc/ssl/cf-assessment/privkey.pem;

    # Per-hostname Authenticated Origin Pulls: private CA that signed the
    # client certificate uploaded to Cloudflare for origin.iforecast.es.
    ssl_client_certificate /etc/ssl/cf-assessment/aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    access_log /var/log/nginx/cfa-origin.log cfa;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Pass the original Host; all other client headers (CF-*, X-Forwarded-*)
        # are forwarded unchanged by default so the app can echo them.
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

# 3) Loopback listener for cloudflared (tunnel.iforecast.es).
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name tunnel.iforecast.es;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/ssl/cf-assessment/fullchain.pem;
    ssl_certificate_key /etc/ssl/cf-assessment/privkey.pem;

    access_log /var/log/nginx/cfa-tunnel.log cfa;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

name: Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  # Manual deployment only: CI never needs Cloudflare credentials to stay green.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the Worker to Cloudflare after lint + tests'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: worker
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
  deploy:
    needs: test
    # Runs only when triggered by hand on main with deploy=true. Requires the
    # `production` environment secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Install locally so wrangler-action uses the pinned Wrangler and jose is bundled.
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
